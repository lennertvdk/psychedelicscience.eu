<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="2; url=https://www.linkedin.com/in/lennert-van-de-kreeke/">
<link rel="canonical" href="https://www.linkedin.com/in/lennert-van-de-kreeke/">
<meta name="robots" content="noindex">
<style>
  html{background:#fff}
  @media (prefers-color-scheme:dark){html{background:#111}}
  /* Nothing paints during the redirect. The fallback below is revealed
     only if we're somehow still here after a second. */
  body{visibility:hidden;margin:0;min-height:100vh;display:grid;place-items:center;
       color-scheme:light dark;
       font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:2rem}
  a{color:#0a66c2}
</style>
<noscript><style>body{visibility:visible}</style></noscript>
<script>
(function () {
  var target = "https://www.linkedin.com/in/lennert-van-de-kreeke/";
  var done = false;
  function go() { if (!done) { done = true; location.replace(target); } }

  // Register the hit with GoatCounter before navigating away. An async
  // <script> tag never finishes loading on an instant-redirect page, so
  // count via the pixel endpoint and leave as soon as it settles.
  var px = new Image();
  px.onload = px.onerror = go;
  px.src = "https://psychedelicscience-eu.goatcounter.com/count"
         + "?p=" + encodeURIComponent(location.pathname)
         + "&r=" + encodeURIComponent(document.referrer)
         + "&t=" + encodeURIComponent(document.title)
         + "&rnd=" + Math.random().toString(36).slice(2);

  setTimeout(go, 500); // don't strand anyone if the beacon hangs

  // Last resort: if the redirect itself was blocked, show the link.
  setTimeout(function () {
    if (document.body) document.body.style.visibility = "visible";
  }, 1500);
})();
</script>
</head>
<body>
  <p>Redirecting to <a href="https://www.linkedin.com/in/lennert-van-de-kreeke/">LinkedIn</a>…</p>
</body>
</html>
